{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-warning">
            <div class="card-header bg-black text-orange text-center border-bottom border-warning">
                <h3>Belépés</h3>
            </div>
            <div class="card-body bg-dark text-white">
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-orange">Felhasználónév</label>
                        <input type="text" name="username" class="form-control bg-black text-white border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-orange">Jelszó</label>
                        <input type="password" name="password" class="form-control bg-black text-white border-secondary" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-orange btn-lg">Belépés</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/register" class="text-light text-decoration-none">Nincs még fiókod? <span class="text-orange">Regisztrálj!</span></a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
